name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity.
# This sends one real request to the database every day so the project never goes idle.
# Needs two repo secrets (same names and values as in your env file): NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.

on:
  schedule:
    - cron: '47 6 * * *' # once a day (UTC)
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set the NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repo secrets."
            exit 1
          fi
          # Reads one row of the public plans table.
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/plans?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat response.json
            exit 1
          fi
          echo "Supabase is awake."
